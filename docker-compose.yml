services:
  postgres:
    image: postgres:17-alpine
    container_name: vanbass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanbass
      POSTGRES_USER: vanbass
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - vanbass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanbass -d vanbass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: vanbass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vanbass_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vanbass_postgres_data:
  vanbass_redis_data: