[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vule482003", email = "levu482003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
[tool.uv]
package = false

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/api/dependencies.py" = ["BLE001"]
"app/api/routes/auth.py" = ["BLE001"]
"app/core/rate_limit.py" = ["BLE001"]
"app/models/*.py" = ["F821"]
"tests/*.py" = ["DTZ011"]
"tests/test_simple.py" = ["BLE001"]
