# ==============================================================================
# NGINX PRODUCTION CONFIGURATION FOR VANMUSIC.COM.VN
# Kiến trúc 301 Canonical Non-WWW, SSL Hardening, Next.js Reverse Proxy
# ==============================================================================

# 1. HTTP -> HTTPS (Chuyển hướng toàn bộ cổng 80 sang HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name vanmusic.com.vn www.vanmusic.com.vn;

    # Let's Encrypt ACME Challenge (dành cho certbot tự động gia hạn)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 301 Permanent Redirect toàn bộ HTTP sang HTTPS Non-WWW
    location / {
        return 301 https://vanmusic.com.vn$request_uri;
    }
}

# 2. HTTPS WWW -> HTTPS Non-WWW (Xử lý 301 triệt để ở tầng Web Server Nginx)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vanmusic.com.vn;

    # Đường dẫn SSL Certificate (Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vanmusic.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanmusic.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 301 Permanent Redirect từ https://www.vanmusic.com.vn sang https://vanmusic.com.vn
    return 301 https://vanmusic.com.vn$request_uri;
}

# 3. HTTPS PRIMARY HOST: vanmusic.com.vn
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vanmusic.com.vn;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/vanmusic.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanmusic.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers (Best practice for Google & Bing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Next.js Static Assets (Cache vĩnh viễn 1 năm)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Media & Images Cache
    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js Application Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (HMR, real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
